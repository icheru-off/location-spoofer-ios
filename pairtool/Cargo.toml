[package]
name = "pairtool"
version = "1.0.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "LocationSpooferPair"
path = "src/main.rs"

[dependencies]
idevice = { git = "https://github.com/jkcoxson/idevice", rev = "89702099f4d7552f704f93b4526756abda319ceb", default-features = false, features = [
    "ring", "tcp", "usbmuxd", "rsd", "xpc", "remote_pairing", "tunnel_tcp_stack",
    "core_device_proxy", "installation_proxy", "house_arrest", "afc",
] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "fs"] }
plist = "1"
